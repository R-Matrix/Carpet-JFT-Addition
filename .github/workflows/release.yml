# 发布: 先构建 MapCatalog, 再构建嵌入 MapCatalog 的 Carpet JAR；带 -mapcatalog 后缀时同时发布独立 MapCatalog JAR
# 工作流结构参考并改写自 Carpet-Igny-Addition，详见 docs/acknowledgments.md
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml

  mapcatalog:
    needs: matrix_prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
          cache-read-only: true
      - name: build MapCatalog ${{ matrix.subproject }}
        run: gradle :mapcatalog-${{ matrix.subproject }}:build -PbuildMapCatalog=true -PembedMapCatalog=false
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: 'true'
      - name: prepare MapCatalog embedding artifact
        shell: bash
        run: |
          set -euo pipefail

          version='${{ matrix.subproject }}'
          jar_path=$(find "mapcatalog/versions/$version/build/libs" -maxdepth 1 -type f \
            -name 'mapcatalog-server-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-shadow.jar' \
            | sort -V | tail -n 1)
          if [ -z "$jar_path" ]; then
            echo "No MapCatalog runtime JAR found for $version" >&2
            exit 1
          fi
          mkdir -p "build/mapcatalog-embedding/$version"
          cp "$jar_path" "build/mapcatalog-embedding/$version/mapcatalog-server.jar"
      - name: upload MapCatalog embedding artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapcatalog-embedding-${{ matrix.subproject }}
          path: build/mapcatalog-embedding/
          if-no-files-found: error
      - name: upload MapCatalog release artifact
        if: ${{ endsWith(github.ref_name, '-mapcatalog') }}
        uses: actions/upload-artifact@v4
        with:
          name: jar-mapcatalog-${{ matrix.subproject }}
          path: |
            mapcatalog/versions/${{ matrix.subproject }}/build/libs/*.jar
            !mapcatalog/versions/${{ matrix.subproject }}/build/libs/*-sources.jar
            !mapcatalog/versions/${{ matrix.subproject }}/build/libs/*-dev.jar
            !mapcatalog/versions/${{ matrix.subproject }}/build/libs/*-shadow.jar
          if-no-files-found: error
  carpet:
    needs: [matrix_prep, mapcatalog]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
          cache-read-only: true
      - name: download MapCatalog embedding artifact
        uses: actions/download-artifact@v4
        with:
          name: mapcatalog-embedding-${{ matrix.subproject }}
          path: build/mapcatalog-embedding
      - name: build Carpet-JFT-Addition ${{ matrix.subproject }}
        run: >-
          gradle :${{ matrix.subproject }}:build
          -PbuildMapCatalog=false
          -PembedMapCatalog=true
          -PmapCatalogArtifactsDir=build/mapcatalog-embedding
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: 'true'
      - name: upload Carpet release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-carpet-${{ matrix.subproject }}
          path: |
            versions/${{ matrix.subproject }}/build/libs/*.jar
            !versions/${{ matrix.subproject }}/build/libs/*-sources.jar
            !versions/${{ matrix.subproject }}/build/libs/*-dev.jar
            !versions/${{ matrix.subproject }}/build/libs/*-shadow.jar
          if-no-files-found: error

  publish:
    needs: [mapcatalog, carpet]
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: download release jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-carpet-*
          path: release-jars
          merge-multiple: true
      - name: download MapCatalog release jars
        if: ${{ endsWith(github.ref_name, '-mapcatalog') }}
        uses: actions/download-artifact@v4
        with:
          pattern: jar-mapcatalog-*
          path: release-jars
          merge-multiple: true
      - name: prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          tag='${{ github.ref_name }}'
          version="${tag#v}"
          version="${version%-mapcatalog}"

          awk -v version="$version" '
            $0 == "## [" version "]" || index($0, "## [" version "] -") == 1 {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG entry found for version $version" >&2
            exit 1
          fi
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          body_path: release-notes.md
          generate_release_notes: false
          name: ${{ endsWith(github.ref_name, '-mapcatalog') && format('Carpet JFT Addition and MapCatalog {0}', github.ref_name) || format('Carpet JFT Addition {0}', github.ref_name) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
