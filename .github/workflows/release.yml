# 发布: 按版本矩阵并行构建, 汇总所有 jar 创建 Release
# 工作流结构参考并改写自 Carpet-Igny-Addition，详见 docs/acknowledgments.md
name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml

  build:
    needs: matrix_prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
          cache-read-only: true
      - name: build ${{ matrix.subproject }}
        run: gradle :${{ matrix.subproject }}:build
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: 'true'
      - name: upload ${{ matrix.subproject }} jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.subproject }}
          path: versions/${{ matrix.subproject }}/build/libs/*.jar

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: download all jars
        uses: actions/download-artifact@v4
        with:
          path: release-jars
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          generate_release_notes: true
          name: Carpet JFT Addition ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
