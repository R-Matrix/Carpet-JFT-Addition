name: release

# 只有当推送标签时才运行
on:
  push:
    tags:
      - 'v*'

# 设置工作流的权限
permissions:
  contents: write  # 允许创建 release 和上传文件

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      # 1. 检出代码
      - name: checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      # 3. 给 gradlew 添加执行权限
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # 4. 构建模组
      - name: build
        run: ./gradlew build

      # 5. 创建 Release 并上传构建产物
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          # 上传所有 jar 文件
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          # 自动生成 release 标题和说明
          generate_release_notes: true
          # 可以自定义 release 名称，例如 "Release v1.0.0"
          name: Carpet JFT Addition ${{ github.ref_name }}
        env:
          # 使用 GitHub 自动提供的 token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}