# 开发构建: 根据变更分别构建 Carpet-JFT-Addition 与 MapCatalog
# 工作流结构参考并改写自 Carpet-Igny-Addition，详见 docs/acknowledgments.md
name: Dev Builds
on:
  push:
    paths:
      - "*.gradle"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - "common.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.json"
      - "src/**"
      - "versions/**"
      - "mapcatalog/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      carpet: ${{ steps.detect.outputs.carpet }}
      mapcatalog: ${{ steps.detect.outputs.mapcatalog }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect changed modules
        id: detect
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$CI_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'carpet=true' >> "$GITHUB_OUTPUT"
            echo 'mapcatalog=true' >> "$GITHUB_OUTPUT"
            echo 'Manual dispatch: build both modules.'
            exit 0
          fi

          case "$CI_EVENT_NAME" in
            pull_request)
              changed_files=$(git diff --name-only "$CI_BASE_SHA" "$CI_HEAD_SHA")
              ;;
            push)
              if [[ "$CI_BEFORE_SHA" =~ ^0+$ || -z "$CI_BEFORE_SHA" ]]; then
                changed_files=$(git diff-tree --no-commit-id --name-only -r --root "$CI_HEAD_SHA")
              else
                changed_files=$(git diff --name-only "$CI_BEFORE_SHA" "$CI_HEAD_SHA")
              fi
              ;;
            *)
              changed_files=$(git diff --name-only HEAD^ HEAD)
              ;;
          esac

          echo 'Changed files:'
          printf '%s\n' "$changed_files"

          shared_pattern='(^build\.gradle$|^settings\.gradle$|^settings\.json$|^gradle\.properties$|^common\.gradle$|^gradle/|^gradlew(\.bat)?$|^\.github/workflows/|^versions/mainProject$|^versions/mapping-)'
          # Carpet artifacts contain MapCatalog as a nested JAR, so both
          # module jobs are required when either module's runtime code changes.
          carpet_pattern='(^src/|^versions/|^mapcatalog/)'
          mapcatalog_pattern='(^src/|^versions/|^mapcatalog/)'

          if printf '%s\n' "$changed_files" | grep -Eq "$shared_pattern|$carpet_pattern"; then
            echo 'carpet=true' >> "$GITHUB_OUTPUT"
          else
            echo 'carpet=false' >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq "$shared_pattern|$mapcatalog_pattern"; then
            echo 'mapcatalog=true' >> "$GITHUB_OUTPUT"
          else
            echo 'mapcatalog=false' >> "$GITHUB_OUTPUT"
          fi

  mapcatalog:
    needs: changes
    if: ${{ needs.changes.outputs.mapcatalog == 'true' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      module: mapcatalog
      mixin_audit: false

  carpet:
    needs: [changes, mapcatalog]
    if: ${{ needs.changes.outputs.carpet == 'true' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      module: carpet
      embed_mapcatalog: true
      mixin_audit: true
