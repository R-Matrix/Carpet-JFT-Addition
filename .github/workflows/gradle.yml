# 开发构建: push/PR 时调用可复用构建工作流 (构建全部版本)
# 工作流结构参考并改写自 Carpet-Igny-Addition，详见 docs/acknowledgments.md
name: Dev Builds
on:
  push:
    paths:
      - "*.gradle"
      - "gradle.properties"
      - "settings.json"
      - "src/**"
      - "versions/**"
      - ".github/workflows"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      mixin_audit: true
