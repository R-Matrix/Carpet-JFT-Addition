# 可复用的构建工作流: 由 gradle.yml (开发构建) 与 release.yml (发布) 调用
name: _step.build
on:
  workflow_call:
    inputs:
      release:
        description: 是否为发布构建 (影响版本后缀)
        type: boolean
        required: false
        default: false
      target_subproject:
        description: 要构建的版本子项目, 逗号分隔; 留空则构建全部
        type: string
        required: false
        default: ''
      mixin_audit:
        description: 是否运行 mixin 审计 (需 common.gradle 配置 runServerMixinAudit)
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}
      - name: build with gradle
        run: |
          if [ -z "${{ inputs.target_subproject }}" ]; then
            echo "Building all subprojects"
            gradle build
          else
            args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:build/' | paste -sd ' ')
            echo "Building with arguments=$args"
            gradle $args
          fi
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}
      - name: detect enchantment-related changes
        id: detect_enchantment
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$CI_EVENT_NAME" in
            pull_request)
              changed_files=$(git diff --name-only "$CI_BASE_SHA" "$CI_HEAD_SHA")
              ;;
            push)
              if [[ "$CI_BEFORE_SHA" =~ ^0+$ ]]; then
                changed_files=$(git diff-tree --no-commit-id --name-only -r --root "$CI_HEAD_SHA")
              else
                changed_files=$(git diff --name-only "$CI_BEFORE_SHA" "$CI_HEAD_SHA")
              fi
              ;;
            workflow_dispatch)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo 'Manual dispatch: run GameTest.'
              exit 0
              ;;
            *)
              changed_files=$(git diff --name-only HEAD^ HEAD)
              ;;
          esac

          echo 'Changed files:'
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eiq '(^|/)(src/testmod/|.*enchantment.*|.*impalingWaterContact.*|.*channelingWeather.*)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Enchantment-related changes detected; run GameTest.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No Enchantment-related changes detected; skip GameTest.'
          fi
      - name: run GameTest
        if: ${{ steps.detect_enchantment.outputs.run == 'true' }}
        timeout-minutes: 30
        run: |
          if [ -n "${{ inputs.target_subproject }}" ]; then
            versions=$(echo "${{ inputs.target_subproject }}" | tr ',' ' ')
          else
            versions=$(jq -r '.versions[]' settings.json)
          fi

          for v in $versions; do
            mkdir -p "versions/$v/run"
            echo eula=true > "versions/$v/run/eula.txt"
            echo ">>> GameTest for $v"
            gradle ":$v:runGameTest"
          done
      - name: run mixin audit
        if: ${{ inputs.mixin_audit }}
        timeout-minutes: 30
        run: |
          for v in $(jq -r '.versions[]' settings.json); do
            mkdir -p "versions/$v/run"
            echo eula=true > "versions/$v/run/eula.txt"
            echo ">>> mixin audit for $v"
            gradle ":$v:runServerMixinAudit"
          done
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: versions/*/build/libs/
