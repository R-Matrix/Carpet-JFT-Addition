# 可复用的构建工作流: 由 gradle.yml (开发构建) 与 release.yml (发布) 调用
# 工作流结构参考并改写自 Carpet-Igny-Addition，详见 docs/acknowledgments.md
name: _step.build
on:
  workflow_call:
    inputs:
      release:
        description: 是否为发布构建 (影响版本后缀)
        type: boolean
        required: false
        default: false
      target_subproject:
        description: 要构建的版本子项目, 逗号分隔; 留空则构建全部
        type: string
        required: false
        default: ''
      module:
        description: 要构建的模块: carpet 或 mapcatalog
        type: string
        required: false
        default: carpet
      embed_mapcatalog:
        description: 是否将对应版本的 MapCatalog 嵌入 Carpet JAR
        type: boolean
        required: false
        default: false
      mixin_audit:
        description: 是否运行 mixin 审计 (需 common.gradle 配置 runServerMixinAudit)
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}
      - name: download MapCatalog embedding artifacts
        if: ${{ inputs.module == 'carpet' && inputs.embed_mapcatalog }}
        uses: actions/download-artifact@v4
        with:
          name: mapcatalog-embedding
          path: build/mapcatalog-embedding
      - name: build with gradle
        run: |
          set -euo pipefail

          module='${{ inputs.module }}'
          target_subproject='${{ inputs.target_subproject }}'

          case "$module" in
            carpet)
              if [[ '${{ inputs.embed_mapcatalog }}' == 'true' ]]; then
                mapcatalog_args=(
                  '-PbuildMapCatalog=false'
                  '-PembedMapCatalog=true'
                  '-PmapCatalogArtifactsDir=build/mapcatalog-embedding'
                )
              else
                mapcatalog_args=('-PbuildMapCatalog=false')
              fi
              if [[ -z "$target_subproject" ]]; then
                echo 'Building Carpet-JFT-Addition versions'
                gradle build "${mapcatalog_args[@]}"
              else
                IFS=',' read -r -a target_versions <<< "$target_subproject"
                gradle_args=()
                for version in "${target_versions[@]}"; do
                  gradle_args+=(":${version}:build")
                done
                echo "Building Carpet-JFT-Addition with arguments=${gradle_args[*]} ${mapcatalog_args[*]}"
                gradle "${gradle_args[@]}" "${mapcatalog_args[@]}"
              fi
              ;;
            mapcatalog)
              if [[ -z "$target_subproject" ]]; then
                mapfile -t target_versions < <(jq -r '.versions[]' settings.json)
              else
                IFS=',' read -r -a target_versions <<< "$target_subproject"
              fi

              gradle_args=()
              for version in "${target_versions[@]}"; do
                gradle_args+=(":mapcatalog-${version}:build")
              done
              echo "Building MapCatalog with arguments=${gradle_args[*]}"
              gradle "${gradle_args[@]}" -PbuildMapCatalog=true -PembedMapCatalog=false
              ;;
            *)
              echo "Unknown module: $module" >&2
              exit 1
              ;;
          esac
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}
      - name: prepare MapCatalog embedding artifacts
        if: ${{ inputs.module == 'mapcatalog' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.target_subproject }}" ]; then
            versions=$(echo "${{ inputs.target_subproject }}" | tr ',' ' ')
          else
            versions=$(jq -r '.versions[]' settings.json)
          fi

          mkdir -p build/mapcatalog-embedding
          for v in $versions; do
            jar_path=$(find "mapcatalog/versions/$v/build/libs" -maxdepth 1 -type f \
              -name 'mapcatalog-server-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-shadow.jar' \
              | sort -V | tail -n 1)
            if [ -z "$jar_path" ]; then
              echo "No MapCatalog runtime JAR found for $v" >&2
              exit 1
            fi
            mkdir -p "build/mapcatalog-embedding/$v"
            cp "$jar_path" "build/mapcatalog-embedding/$v/mapcatalog-server.jar"
          done
      - name: upload MapCatalog embedding artifacts
        if: ${{ inputs.module == 'mapcatalog' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapcatalog-embedding
          path: build/mapcatalog-embedding/
          if-no-files-found: error
      - name: detect enchantment-related changes
        id: detect_enchantment
        if: ${{ inputs.module == 'carpet' }}
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$CI_EVENT_NAME" in
            pull_request)
              changed_files=$(git diff --name-only "$CI_BASE_SHA" "$CI_HEAD_SHA")
              ;;
            push)
              if [[ "$CI_BEFORE_SHA" =~ ^0+$ ]]; then
                changed_files=$(git diff-tree --no-commit-id --name-only -r --root "$CI_HEAD_SHA")
              else
                changed_files=$(git diff --name-only "$CI_BEFORE_SHA" "$CI_HEAD_SHA")
              fi
              ;;
            workflow_dispatch)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              echo 'Manual dispatch: run GameTest.'
              exit 0
              ;;
            *)
              changed_files=$(git diff --name-only HEAD^ HEAD)
              ;;
          esac

          echo 'Changed files:'
          printf '%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eiq '(^|/)(src/testmod/|.*enchantment.*|.*impalingWaterContact.*|.*channelingWeather.*)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Enchantment-related changes detected; run GameTest.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No Enchantment-related changes detected; skip GameTest.'
          fi
      - name: run GameTest
        if: ${{ inputs.module == 'carpet' && steps.detect_enchantment.outputs.run == 'true' }}
        timeout-minutes: 30
        run: |
          if [ -n "${{ inputs.target_subproject }}" ]; then
            versions=$(echo "${{ inputs.target_subproject }}" | tr ',' ' ')
          else
            versions=$(jq -r '.versions[]' settings.json)
          fi

          for v in $versions; do
            mkdir -p "versions/$v/run"
            echo eula=true > "versions/$v/run/eula.txt"
            echo ">>> GameTest for $v"
            gradle ":$v:runGameTest"
          done
      - name: run mixin audit
        if: ${{ inputs.module == 'carpet' && inputs.mixin_audit }}
        timeout-minutes: 30
        run: |
          if [ -n "${{ inputs.target_subproject }}" ]; then
            versions=$(echo "${{ inputs.target_subproject }}" | tr ',' ' ')
          else
            versions=$(jq -r '.versions[]' settings.json)
          fi

          for v in $versions; do
            mkdir -p "versions/$v/run"
            echo eula=true > "versions/$v/run/eula.txt"
            echo ">>> mixin audit for $v"
            gradle ":$v:runServerMixinAudit"
          done
      - name: upload Carpet-JFT-Addition artifacts
        if: ${{ inputs.module == 'carpet' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-carpet
          path: |
            versions/*/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
            !**/*-shadow.jar
          if-no-files-found: error
      - name: upload MapCatalog artifacts
        if: ${{ inputs.module == 'mapcatalog' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-mapcatalog
          path: |
            mapcatalog/versions/*/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
            !**/*-shadow.jar
          if-no-files-found: error
