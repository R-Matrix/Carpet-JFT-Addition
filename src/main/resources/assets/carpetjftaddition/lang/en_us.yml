carpetjftaddition:
  carpet_translations:
    rule:
      channelingWeather:
        name: channelingWeather
        desc: Controls the weather requirement for Channeling enchantment on tridents
        extra:
          '0': Useful for achievement farms, guardian farms, or head farms.
      channelingCanSeeSky:
        name: channelingCanSeeSky
        desc: Controls whether Channeling requires clear sky access
      riptideTouchingWater:
        name: riptideTouchingWater
        desc: Controls whether Riptide requires player contact with water
        extra:
          '0': Requires both client and server installation for proper functionality.
          '1': Epic Riptide buff! (not really).
      drownedReinforcementCanSpawnZombie:
        name: drownedReinforcementCanSpawnZombie
        desc: Makes drowned reinforcements spawn zombies instead of drowned
      drownedSpawnHasEquipments:
        name: drownedSpawnHasEquipments
        desc: Adjusts probability of drowned spawning with equipment
        extra:
          '0': Range 0-1 (1 = always spawn with equipment)
          '1': Drowned may spawn with tridents or fishing rods.
      reinforcementAttributeInit:
        name: reinforcementAttributeInit
        desc: Modifies initial reinforcement capability for zombie-type mobs
        extra:
          '1': Range 0-1
          '0': Only affects newly spawned zombie-type mobs.
      changeUseTridentTimeTicks:
        name: changeUseTridentTimeTicks
        desc: Adjusts trident charge requirement in game ticks (gt). Default 10gt (0.5 seconds)
        extra:
          '0': Affects both throwable and Riptide tridents
          '1': Animation is fixed at 10gt; additional charge time occurs after animation
          '2': Combine with `riptideTouchingWater` rule for interesting effects
          '3': Setting to `0` with `riptideTouchingWater=ANY` enables extreme speeds with elytra
          '4': Avoid setting too low with Riptide to prevent terrain loading issues. Extreme speeds may cause server lag or crashes
      canPlayerPickUpLikeArrows:
        name: canPlayerPickUpLikeArrows
        desc: Allows players to collect arrow-type projectiles not from players.
        extra:
          '0': Players can collect arrows and tridents from skeletons and drowned.
          '1': Trident collection requires the drowned to be defeated first.
      tridentMultipleDamage:
        name: tridentMultipleDamage
        desc: Reintroduces multi-hit and area damage from versions 25w41a-25w43a, reintroduces "fixed bugs" (wink).
        extra:
          '0': Java Edition players can now enjoy trident blender mechanics!
      impalingWaterContact:
        name: impalingWaterContact
        desc: Modifies the Impaling enchantment to trigger bonus damage when the target entity is touching water, instead of requiring the target to be an aquatic mob.
        extra:
          '0': This change makes Impaling more versatile in aquatic combat scenarios.
      turtleKelpFeedingAndViviparousBreeding:
        name: turtleKelpFeedingAndViviparousBreeding
        desc: Allows turtles to breed using kelp instead of seagrass, and enables viviparous reproduction.
        extra:
          '0': Turtles can now be bred by feeding them kelp instead of seagrass.
          '1': Breeding results in live birth of baby turtles instead of laying eggs.
      frogDyeFeedingAndViviparousBreeding:
        name: frogDyeFeedingAndViviparousBreeding
        desc: Allows frogs to breed using dyes instead of slime balls, and enables viviparous reproduction.
      allowAmethystBudCanGrowAtWater:
        name: allowAmethystBudCanGrowAtWater
        desc: Allows amethyst buds to grow in only air.
      amethystPistonBehaviorNormal:
        name: amethystPistonBehaviorNormal
        desc: (Amethyst cluster and small amethyst bud)'s piston behaviour like normal block instead of destroy
      glowLichenCanShadowBlocks:
        name: glowLichenCanShadowBlocks
        desc: Can glow_lichen shadow any block.