carpetjftaddition:
  carpet_translations:
    rule:
      channelingWeather:
        name: 控制引雷附魔天气要求
        desc: 控制三叉戟引雷附魔的天气要求
        extra:
          '0': 或许可以用在成就获取?远古守卫者农场?头颅农场?
          '1': VANILLA - 原版表现
          '2': RAINING - 下雨即可引雷(同基岩版表现)
          '3': ANY - 无视天气引雷
          '4': DISABLED - 禁用引雷附魔引雷
      channelingCanSeeSky:
        name: 控制引雷附魔露天判断要求
        desc: 控制三叉戟引雷附魔的露天判断要求
      riptideTouchingWater:
        name: 控制激流是否要求玩家接触水
        desc: 控制激流是否要求玩家接触水
        extra:
          '0': 激流史诗级加强! (bushi
          '1': 貌似需要客户端和服务端均安装该拓展才可正常使用
          '2': VANILLA - 原版表现, 即玩家必须接触水(触碰水或淋雨)
          '3': WATERRorLAVA - 碰水或碰岩浆均可使用
          '4': ANY - 无视任何条件均可使用激流
          '5': DISABLED - 禁止玩家使用激流三叉戟
      drownedReinforcementCanSpawnZombie:
        name: 溺尸进行僵尸增援时生成僵尸而非溺尸
        desc: 溺尸进行僵尸增援时生成僵尸而非溺尸
      drownedSpawnHasEquipments:
        name: 修改溺尸生成时携带装备的概率
        desc: 修改溺尸生成时携带装备的概率
        extra:
          '0': 溺尸可能生成时携带装备, 三叉戟或钓鱼竿
          '1': 可修改的取值为 0-1, 1 代表一定生成
      reinforcementAttributeInit:
        name: 修改僵尸类生物生成时的初始增援能力
        desc: 修改僵尸类生物生成时的初始增援能力(属性)
        extra:
          '0': 修改后仅影响新生成的僵尸类生物
          '1': 可修改的取值为 0-1
      changeUseTridentTimeTicks:
        name: 修改使用三叉戟需求蓄力时间
        desc: 修改使用三叉戟需求的蓄力时间, 单位为游戏刻(gt), 默认为10gt(0.5s)
        extra:
          '0': 对可投掷的三叉戟和不可投掷的三叉戟(激流)均生效
          '1': 由于三叉戟蓄力动画为10gt, 因此当设置时间超过10时, 动画结束后再蓄力一段时间才可使用
          '2': 配合规则 `riptideTouchingWater` 有神奇的效果
          '3': 如果使用激流三叉戟配合绗棉的规则建议不要设置的太短, 否则速度过快容易创死或加载不出地形, 导致服务器大量卡顿
          '4': 将此规则设置为 `0` 并且 `riptideTouchingWater` 设置为 `ANY` 时, 配合激流三三叉戟和鞘翅, 速度可破千.
          '5': 不要利用此大范围跑图, 容易崩(
      canPlayerPickUpLikeArrows:
        name: 控制玩家是否可以捡起箭矢类物品(草船借箭)
        desc: 控制玩家是否可以捡起来自于(骷髅, 溺尸)的箭矢类物品(箭矢, 三叉戟 etc.)
        extra:
          '0': mc 版的草船借箭(
          '1': 由于某些原因, 由溺尸扔出的三叉戟只有其溺尸死亡后方可被玩家捡起.
      tridentMultipleDamage:
        name: 允许三叉戟多段攻击
        desc: 重新引入25w41a - 25w43a 的三叉戟帧伤和群伤
        extra:
          '0': ~JAVI玩家再也不用羡慕BE玩家的三叉戟搅拌机了`!(滑稽)
          '1': 还有重新引入修复的`恶性bug`的(bushi
      impalingWaterContact:
        name: 穿刺接触水即可生效
        desc: 修改穿刺附魔的效果触发条件，像基岩版那样, 从"仅对水生生物生效"改为"任何生物接触水即生效"
        extra:
          '0': 当目标实体接触水时，穿刺附魔即可造成额外伤害，使该附魔在水下战斗中更加实用. 穿刺V可打出21.5的伤害!
          '1': 此规则改变了原版Java版中穿刺附魔仅对特定水生生物生效的限制，使其行为更接近某些自定义战斗场景的需求.
      turtleKelpFeedingAndViviparousBreeding:
        name: 海龟海带喂食与胎生繁殖机制
        desc: 控制海龟是否可以通过喂食海带进行繁殖，并实现胎生机制而非产卵
        extra:
          '0': 海龟现在可以通过喂食海带来繁殖
          '1': 繁殖后海龟会直接生下幼年海龟，而不是产下海龟蛋
      frogDyeFeedingAndViviparousBreeding:
        name: 青蛙染料喂食与胎生繁殖机制
        desc: 控制青蛙是否可以通过喂食染料进行繁殖，并实现胎生机制而非产卵