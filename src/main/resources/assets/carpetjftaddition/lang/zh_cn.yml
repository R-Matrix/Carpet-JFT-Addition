carpetjftaddition:
  carpet_translations:
    rule:
      jftMapSyncProtocol:
        name: 启用 JFTM 地图同步协议
        desc: 控制 Carpet JFT Addition 是否允许 MapCatalog 地图同步协议
        extra:
          '0': 关闭后，服务端会拒绝 MapCatalog 的同步请求
          '1': 仅在同时安装 Carpet JFT Addition 和 MapCatalog 时生效
      channelingWeather:
        name: 控制引雷附魔天气要求
        desc: 控制三叉戟引雷附魔的天气要求
        extra:
          '0': 或许可以用在成就获取?远古守卫者农场?头颅农场?
          '1': VANILLA - 原版表现
          '2': RAINING - 下雨即可引雷(同基岩版表现)
          '3': ANY - 无视天气引雷
          '4': DISABLED - 禁用引雷附魔引雷
      channelingCanSeeSky:
        name: 控制引雷附魔露天判断要求
        desc: 控制三叉戟引雷附魔的露天判断要求
      riptideTouchingWater:
        name: 控制激流是否要求玩家接触水
        desc: 控制激流是否要求玩家接触水
        extra:
          '0': 激流史诗级加强! (bushi
          '1': 貌似需要客户端和服务端均安装该拓展才可正常使用
          '2': VANILLA - 原版表现, 即玩家必须接触水(触碰水或淋雨)
          '3': WATERRorLAVA - 碰水或碰岩浆均可使用
          '4': ANY - 无视任何条件均可使用激流
          '5': DISABLED - 禁止玩家使用激流三叉戟
      drownedReinforcementCanSpawnZombie:
        name: 溺尸进行僵尸增援时生成僵尸而非溺尸
        desc: 溺尸进行僵尸增援时生成僵尸而非溺尸
      drownedSpawnHasEquipments:
        name: 修改溺尸生成时携带装备的概率
        desc: 修改溺尸生成时携带装备的概率
        extra:
          '0': 溺尸可能生成时携带装备, 三叉戟或钓鱼竿
          '1': 可修改的取值为 0-1, 1 代表一定生成
      reinforcementAttributeInit:
        name: 修改僵尸类生物生成时的初始增援能力
        desc: 修改僵尸类生物生成时的初始增援能力(属性)
        extra:
          '0': 修改后仅影响新生成的僵尸类生物
          '1': 可修改的取值为 0-1
      changeUseTridentTimeTicks:
        name: 修改使用三叉戟需求蓄力时间
        desc: 修改使用三叉戟需求的蓄力时间, 单位为游戏刻(gt), 默认为10gt(0.5s)
        extra:
          '0': 对可投掷的三叉戟和不可投掷的三叉戟(激流)均生效
          '1': 由于三叉戟蓄力动画为10gt, 因此当设置时间超过10时, 动画结束后再蓄力一段时间才可使用
          '2': 配合规则 `riptideTouchingWater` 有神奇的效果
          '3': 如果使用激流三叉戟配合绗棉的规则建议不要设置的太短, 否则速度过快容易创死或加载不出地形, 导致服务器大量卡顿
          '4': 将此规则设置为 `0` 并且 `riptideTouchingWater` 设置为 `ANY` 时, 配合激流三三叉戟和鞘翅, 速度可破千.
          '5': 不要利用此大范围跑图, 容易崩(
      canPlayerPickUpLikeArrows:
        name: 控制玩家是否可以捡起箭矢类物品(草船借箭)
        desc: 控制玩家是否可以捡起来自于(骷髅, 溺尸)的箭矢类物品(箭矢, 三叉戟 etc.)
        extra:
          '0': mc 版的草船借箭(
          '1': 由于某些原因, 由溺尸扔出的三叉戟只有其溺尸死亡后方可被玩家捡起.
      tridentMultipleDamage:
        name: 允许三叉戟多段攻击
        desc: 重新引入25w41a - 25w43a 的三叉戟帧伤和群伤
        extra:
          '0': ~JAVI玩家再也不用羡慕BE玩家的三叉戟搅拌机了`!(滑稽)
          '1': 还有重新引入修复的`恶性bug`的(bushi
      impalingWaterContact:
        name: 穿刺接触水即可生效
        desc: 修改穿刺附魔的效果触发条件，像基岩版那样, 从"仅对水生生物生效"改为"任何生物接触水即生效"
        extra:
          '0': 当目标实体接触水时，穿刺附魔即可造成额外伤害，使该附魔在水下战斗中更加实用. 穿刺V可打出21.5的伤害!
          '1': 此规则改变了原版Java版中穿刺附魔仅对特定水生生物生效的限制，使其行为更接近某些自定义战斗场景的需求.
      turtleKelpFeedingAndViviparousBreeding:
        name: 海龟海带喂食与胎生繁殖机制
        desc: 控制海龟是否可以通过喂食海带进行繁殖，并实现胎生机制而非产卵
        extra:
          '0': 海龟现在可以通过喂食海带来繁殖
          '1': 繁殖后海龟会直接生下幼年海龟，而不是产下海龟蛋
      frogDyeFeedingAndViviparousBreeding:
        name: 青蛙染料喂食与胎生繁殖机制
        desc: 控制青蛙是否可以通过喂食染料进行繁殖，并实现胎生机制而非产卵
        extra:
          '0': 只能使用橙色, 绿色, 白色三种染料. 并且生出对应颜色的子蛙, 跳过产卵和蝌蚪阶段
      allowAmethystBudCanGrowAtWater:
        name: 控制紫水晶母岩是否能在水中生长出紫水晶
        desc: 控制紫水晶母岩是否能在水中生长出紫水晶
        extra:
          '0': 可以防止在无侧沟世吞中由于紫水晶母岩生长的紫水晶破坏水墙
      amethystPistonBehaviorNormal:
        name: 紫水晶簇活塞表现正常
        desc: 紫水晶簇和小型紫水晶在被活塞推拉时活塞其行为表现为正常方块而不是被破坏
        extra:
          '0': 使得紫水晶簇和小型紫水晶回退到21w11a前紫水晶簇和紫水晶芽类方块的表现, 这也使得紫水晶复制bug再现
      glowLichenCanShadowBlocks:
        name: 发光地衣可吞噬方块
        desc: 当活塞推动一个方块时，如果该方块的推动方向那一面附着有发光地衣, 发光地衣到位处的方块会消失.
        extra:
          '0': 发光地衣到位后仍会产生更新
          '1': 只能是推动方向,  拉回方向发光地衣会被破坏
      signTextGlowingAlways:
        name: 告示牌放下后文字总发光
        desc: 放下的告示牌文字总是使用荧光墨囊那样高亮显示
      wetSpongeDriesOnDesertAndBedLands:
        name: 湿海绵在炎热群系蒸干
        desc: 湿海绵可以在沙漠或恶地(及其变种)群系蒸干, 就像在下界一样.
      goatHayFeedingAndChildScreaming:
        name: 干草块喂食得到尖啸山羊
        desc: 通过给山羊喂食干草捆可以让其生出尖啸山羊
        extra:
          '0': 在原版中, 当父母都不是尖啸山羊时, 子代只有0.2%的概率时尖啸山羊
      turtleEggsDriedKelpBlockFaster:
        name: 海龟蛋在干海带块上加速孵化
        desc: 海龟蛋放在干海带块上可以加速孵化, 时间大概缩短到10min.
        extra:
          '0': 原版中, 当海龟蛋放到沙子中时, 海龟蛋大概需要90min才能孵化.
      animalsSpanLimit:
        name: 动物生成数量上限
        desc: 修改动物自然生成的数量上限, 原版为10
      animalsRaleSetting:
        name: 设置动物是否为稀有生成
        desc: 设置动物的生成是否属于稀有生成
        extra:
          '0': 稀有生成会限制20s尝试生成一次, 非稀有为1gt尝试生成一次
      canTillFarmlandBelowBlock:
        name: 锄头在非空气方块下也能耕地
        desc: 当泥土类方块上方为冰块, 水, 或者基岩时, 锄头也能耕地
        extra:
          '0': 可能在制作西瓜南瓜机有用处
      shulkerBaseTickIfOnTwistingVine:
        name: 潜影贝在缠怨藤中只进行 baseTick 活动
        desc: 潜影贝在缠怨藤(包括植株)中只进行baseTick活动.
        extra:
          '0': 在 12800HX 原版中堆叠 2444 只潜影贝为 825 mspt, 开启后约为 3-4 mspt
          '1': 开启后, 在缠怨藤中的潜影贝不会试图传送或索敌, 不会上下矿车.
          '2': 开启后, 客户端在使用矿车运输潜影贝时, 潜影贝尝试下车到缠怨藤时会出现渲染错误. 退出重进即可正常, 不会影响潜影贝下车的位置.
      interceptItemFrameDrop:
        name: 阻止打掉物品展示框
        desc: 当物品展示框附着于灰色混凝土或干海带块时, 非创造模式的玩家无法破坏展示框, 除非他们主手拿着白名单物品.
        extra:
          '0': 白名单物品有物品展示框, 发光物品展示框, 镐子, 斧子
          '1': 只影响破坏物品展示框, 从物品展示框中拿下物品不受影响
      canArrowDamageItemFrame:
        name: 箭类弹射物是否伤害物品展示框
        desc: 当物品展示框附着于灰色混凝土或干海带块时, 如果物品展示框中有物品展示, 那么弹射物不会将物品展示框中的物品射下.
      spawnEggYellowGlassSmallVariant:
        name: 黄色染色玻璃召唤小型变种
        desc: 在黄色染色玻璃上使用刷怪蛋召唤生物时, 召唤出的生物一定为小型变种 (动物/僵尸为幼年, 史莱姆为小型)
        extra:
          '0': 若刷怪蛋带有自定义实体标签 (minecraft:entity_data), 则忽略此规则, 以标签为准
          '1': 仅对支持幼年或体型的生物生效 (如动物, 僵尸, 史莱姆)
          '2': 不适用于刷怪笼, 水面/岩浆召唤, 以及对已有生物使用刷怪蛋
      spawnEggGreenGlassLargeVariant:
        name: 绿色染色玻璃召唤大型生物
        desc: 在绿色染色玻璃上使用刷怪蛋召唤生物时, 召唤出的生物一定为大型变种 (动物/僵尸为成年, 史莱姆为大型)
        extra:
          '0': 若刷怪蛋带有自定义实体标签 (minecraft:entity_data), 则忽略此规则, 以标签为准
          '1': 史莱姆会被召唤为大型史莱姆 (Size 4), 其余生物为成年体
      trialSpawnerRecognitionSLPlayerAsMul:
        name: 试炼刷怪笼识别SL假人按倍数计入战斗人数(假人以一当十)
        desc: 名字前缀为 bot_sljr 的假人在试炼刷怪笼及不详试炼刷怪笼中按指定倍数计入战斗人数, 奖励也按倍数弹出
        extra:
          '0': 设为 10 时, 1 个假人等效 10 个玩家, 总怪物数/同屏怪物数按 10 人计算, 结束阶段一次弹出 10 份奖励
          '1': 设为 1 即原版行为
