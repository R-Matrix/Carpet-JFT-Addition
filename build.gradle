plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'me.fallenbreath.yamlang' version '1.5.0' apply false

	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'c5abb4fb12'
}

def buildMapCatalog = providers.gradleProperty('buildMapCatalog')
	.map { value -> Boolean.parseBoolean(value) }
	.orElse(true)

preprocess {
	strictExtraMappings = false

	def versionData = [
		['1.21.1', 1_21_01],
		['1.21.3', 1_21_03],
		['1.21.4', 1_21_04],
		['1.21.5', 1_21_05],
		['1.21.8', 1_21_08],
		['1.21.10', 1_21_10]
	]
	def makeChain = { String prefix ->
		versionData.collect { data ->
			String name = prefix.isEmpty() ? data[0] : "${prefix}-${data[0]}"
			createNode(name, data[1], '')
		}
	}
	def mainNodes = makeChain('')
	def linkChain = { List nodes ->
		nodes.collate(2, 1, false).each { pair ->
			pair[0].link(pair[1], file("versions/mapping-${pair[0].project.replace('mapcatalog-', '')}-${pair[1].project.replace('mapcatalog-', '')}.txt"))
		}
	}
	linkChain(mainNodes)

	if (buildMapCatalog.get()) {
		def mapCatalogNodes = makeChain('mapcatalog')
		linkChain(mapCatalogNodes)

		// The preprocessor owns one graph for the whole Gradle build. Connect the
		// two module chains at the shared main version so both modules can resolve
		// their own `versions/mainProject` file without creating a second graph.
		mainNodes.find { it.project == '1.21.4' }.link(
			mapCatalogNodes.find { it.project == 'mapcatalog-1.21.4' },
			null
		)
	}

	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

def buildProjects = {
	subprojects.findAll { project ->
		buildMapCatalog.get() || !project.name.startsWith('mapcatalog-')
	}
}

tasks.register('buildAndGather') {
	buildProjects().each { project ->
		dependsOn project.tasks.named('build')
	}
	doFirst {
		println 'Gathering builds'
		if (!buildMapCatalog.get()) {
			println 'Skipping MapCatalog builds (use -PbuildMapCatalog=true to include them)'
		}
		def rootBuildLibs = rootProject.layout.buildDirectory.dir('libs').get().asFile
		delete fileTree(rootBuildLibs) {
			include '*'
		}
	}
	doLast {
		def rootBuildLibs = rootProject.layout.buildDirectory.dir('libs').get().asFile
		buildProjects().each { project ->
			def remapJar = project.tasks.findByName('remapJar')
			if (remapJar != null) {
				copy {
					from(remapJar.archiveFile)
					into rootBuildLibs
					duplicatesStrategy = DuplicatesStrategy.INCLUDE
				}
			}
		}
	}
}

// 让根项目 ./gradlew build 也能直接产出全部版本的 jar
if (!tasks.findByName('build')) {
	tasks.register('build') {
		dependsOn 'buildAndGather'
	}
} else {
	tasks.named('build') {
		dependsOn 'buildAndGather'
	}
}

apply from: rootProject.file('gradle/jft-release.gradle')
