import java.nio.charset.StandardCharsets
import java.util.regex.Matcher
import java.util.regex.Pattern

def versionPattern = Pattern.compile('^[0-9]+\\.[0-9]+\\.[0-9]+$')

def readProperty = { String content, String key ->
	def pattern = Pattern.compile('^\\s*' + Pattern.quote(key) + '\\s*=\\s*(.*?)\\s*$')
	for (String line : content.split(/\r?\n/)) {
		def matcher = pattern.matcher(line)
		if (matcher.matches()) {
			return matcher.group(1)
		}
	}
	return null
}

def replaceProperty = { String content, String key, String value ->
	String newline = content.contains('\r\n') ? '\r\n' : '\n'
	List<String> lines = content.split(/\r?\n/, -1).toList()
	def pattern = Pattern.compile('^\\s*' + Pattern.quote(key) + '\\s*=.*$')
	boolean replaced = false

	for (int index = 0; index < lines.size(); index++) {
		if (pattern.matcher(lines[index]).matches()) {
			lines[index] = "${key}=${value}"
			replaced = true
			break
		}
	}

	if (!replaced) {
		if (!lines.isEmpty() && !lines[-1].isEmpty()) {
			lines.add('')
		}
		lines.add("${key}=${value}")
	}

	return lines.join(newline)
}

def nextPatchVersion = { String version ->
	def parts = version.split('\\.')
	return "${parts[0]}.${parts[1]}.${Integer.parseInt(parts[2]) + 1}"
}

def makeChangelogEntry = { String version, String tagName, String date ->
	"""## [${version}] - ${date}

## ${tagName} 更新

### Added

### Changed

### Fixed

### Removed

---

<!-- JFT_RELEASE_AUTO_APPEND -->
"""
}

def insertChangelogEntry = { String original, String version, String tagName, String date ->
	String newline = original.contains('\r\n') ? '\r\n' : '\n'
	String normalized = original.replace('\r\n', '\n')
	String releaseHeader = "## [${version}]"
	if (normalized.readLines().any { line ->
		line == releaseHeader || line.startsWith("${releaseHeader} -")
	}) {
		throw new GradleException("CHANGELOG.md 已经存在版本 ${version}，请检查后再发布。")
	}

	String entry = makeChangelogEntry(version, tagName, date)
	int firstReleaseStart = normalized.indexOf('\n## [')
	String updated
	if (firstReleaseStart < 0) {
		updated = normalized.replaceFirst(/\s+$/, '') + "\n\n" + entry
	} else {
		int insertionPoint = firstReleaseStart + 1
		updated = normalized.substring(0, insertionPoint) + entry + "\n" + normalized.substring(insertionPoint)
	}
	return updated.replace('\n', newline)
}

def normalizeChangelogEnding = { String content ->
	String newline = content.contains('\r\n') ? '\r\n' : '\n'
	String normalized = content.replace('\r\n', '\n').replaceFirst(/\s+$/, '')
	return normalized.replace('\n', newline) + newline
}

def changelogEntryHasContent = { String content, String version ->
	String normalized = content.replace('\r\n', '\n')
	String header = "## [${version}]"
	int start = normalized.readLines().findIndexOf { line ->
		line == header || line.startsWith("${header} -")
	}
	if (start < 0) {
		return false
	}
	List<String> lines = normalized.readLines()
	for (int index = start + 1; index < lines.size(); index++) {
		if (lines[index].startsWith('## [')) {
			break
		}
		if (lines[index].trim().startsWith('- ') && lines[index].trim().length() > 2) {
			return true
		}
	}
	return false
}

def updateMapCatalogReadme = { String content, String tagName ->
	String mapCatalogReleaseUrl = "https://github.com/R-Matrix/Carpet-JFT-Addition/releases/tag/${tagName}"
	Pattern mapCatalogUrlPattern = Pattern.compile(
		'https://github\\.com/R-Matrix/Carpet-JFT-Addition/releases/tag/v[0-9]+\\.[0-9]+\\.[0-9]+-mapcatalog'
	)
	def matcher = mapCatalogUrlPattern.matcher(content)
	if (!matcher.find()) {
		throw new GradleException('README.md 中没有找到 MapCatalog 发布链接，无法自动更新。')
	}
	if (matcher.find()) {
		throw new GradleException('README.md 中找到多个 MapCatalog 发布链接，请手动整理后再发布。')
	}
	return mapCatalogUrlPattern.matcher(content).replaceFirst(Matcher.quoteReplacement(mapCatalogReleaseUrl))
}

tasks.register('jftRelease') {
	group = 'release'
	description = 'Interactively update release versions and create a release commit and tag'

	doLast {
		File propertiesFile = rootProject.file('gradle.properties')
		File changelogFile = rootProject.file('CHANGELOG.md')
		File readmeFile = rootProject.file('README.md')
		String originalProperties = propertiesFile.getText(StandardCharsets.UTF_8.name())
		boolean changelogExisted = changelogFile.exists()
		String originalChangelog = changelogExisted
			? changelogFile.getText(StandardCharsets.UTF_8.name())
			: ''
		boolean readmeExisted = readmeFile.exists()
		String originalReadme = readmeExisted
			? readmeFile.getText(StandardCharsets.UTF_8.name())
			: ''
		String currentCarpetVersion = readProperty(originalProperties, 'mod_version')
		String currentMapCatalogVersion = readProperty(originalProperties, 'mapcatalog_version')

		if (currentCarpetVersion == null || !versionPattern.matcher(currentCarpetVersion).matches()) {
			throw new GradleException("gradle.properties 中的 mod_version 无效: ${currentCarpetVersion}")
		}
		if (currentMapCatalogVersion == null || !versionPattern.matcher(currentMapCatalogVersion).matches()) {
			throw new GradleException("gradle.properties 中的 mapcatalog_version 无效: ${currentMapCatalogVersion}")
		}

		def runGit = { List<String> arguments, boolean allowFailure = false ->
			def command = new java.util.ArrayList<String>(arguments.size() + 1)
			command.add('git')
			arguments.each { argument ->
				command.add(argument.toString())
			}
			def process = new ProcessBuilder(command)
				.directory(rootProject.projectDir)
				.redirectErrorStream(false)
				.start()
			def stdout = new ByteArrayOutputStream()
			def stderr = new ByteArrayOutputStream()
			Thread stdoutReader = Thread.start {
				process.inputStream.transferTo(stdout)
			}
			Thread stderrReader = Thread.start {
				process.errorStream.transferTo(stderr)
			}
			int exitCode = process.waitFor()
			stdoutReader.join()
			stderrReader.join()
			def output = [
				exitCode: exitCode,
				stdout: stdout.toString(StandardCharsets.UTF_8.name()).trim(),
				stderr: stderr.toString(StandardCharsets.UTF_8.name()).trim()
			]
			if (output.exitCode != 0 && !allowFailure) {
				String detail = output.stderr ?: output.stdout
				throw new GradleException("git ${arguments.join(' ')} 执行失败: ${detail}")
			}
			return output
		}

		if (runGit(['status', '--porcelain']).stdout) {
			throw new GradleException('工作区不是干净的。请先提交或处理现有修改，再运行 jftRelease。')
		}
		String branch = runGit(['branch', '--show-current']).stdout
		if (!branch) {
			throw new GradleException('当前处于 detached HEAD，不能创建发布提交。请先切换到一个分支。')
		}

		def reader = new BufferedReader(new InputStreamReader(System.in, StandardCharsets.UTF_8))
		def readInput = { String prompt ->
			print(prompt)
			System.out.flush()
			String value = reader.readLine()
			if (value == null) {
				throw new GradleException('未读取到输入，发布操作已取消。')
			}
			return value.trim()
		}
		def askYesNo = { String prompt, boolean defaultYes ->
			while (true) {
				String answer = readInput("${prompt} [${defaultYes ? 'Y/n' : 'y/N'}] ")
				if (answer.isEmpty()) {
					return defaultYes
				}
				if (answer.equalsIgnoreCase('y') || answer.equalsIgnoreCase('yes')) {
					return true
				}
				if (answer.equalsIgnoreCase('n') || answer.equalsIgnoreCase('no')) {
					return false
				}
				println('请输入 y 或 n。')
			}
		}
		def askVersion = { String product, String currentVersion ->
			String suggestedVersion = nextPatchVersion(currentVersion)
			while (true) {
				String answer = readInput("新的 ${product} 版本号 [${suggestedVersion}] ")
				String selected = answer.isEmpty() ? suggestedVersion : answer
				if (versionPattern.matcher(selected).matches()) {
					return selected
				}
				println('版本号必须是类似 1.2.3 的格式。')
			}
		}
		def restoreReleaseFiles = {
			propertiesFile.setText(originalProperties, StandardCharsets.UTF_8.name())
			if (changelogExisted) {
				changelogFile.setText(originalChangelog, StandardCharsets.UTF_8.name())
			} else if (changelogFile.exists()) {
				if (!changelogFile.delete()) {
					println('警告：无法删除新生成的 CHANGELOG.md，请手动恢复。')
				}
			}
			if (readmeExisted) {
				readmeFile.setText(originalReadme, StandardCharsets.UTF_8.name())
			} else if (readmeFile.exists()) {
				if (!readmeFile.delete()) {
					println('警告：无法删除新生成的 README.md，请手动恢复。')
				}
			}
		}
		def openNotepad = { File file ->
			if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
				throw new GradleException('当前发布助手已配置为使用记事本，仅支持 Windows。')
			}
			def command = new java.util.ArrayList<String>()
			command.add('notepad.exe')
			command.add(file.absolutePath)
			def editor = new ProcessBuilder(command)
				.directory(rootProject.projectDir)
				.inheritIO()
				.start()
			int exitCode = editor.waitFor()
			if (exitCode != 0) {
				throw new GradleException("记事本退出异常，退出码: ${exitCode}")
			}
		}

		println('')
		println('JFT Release Assistant')
		println('1) 只发布 Carpet JFT Addition')
		println('2) 发布 Carpet JFT Addition 和 MapCatalog')
		String releaseChoice = readInput('选择发布类型 [1] ')
		if (releaseChoice.isEmpty()) {
			releaseChoice = '1'
		}
		if (releaseChoice != '1' && releaseChoice != '2') {
			throw new GradleException('发布类型必须是 1 或 2。')
		}
		boolean includeMapCatalog = releaseChoice == '2'

		boolean updateCarpetVersion = askYesNo("更新 Carpet 版本号（当前 ${currentCarpetVersion}）?", true)
		String carpetVersion = updateCarpetVersion
			? askVersion('Carpet JFT Addition', currentCarpetVersion)
			: currentCarpetVersion

		boolean updateMapCatalogVersion = includeMapCatalog && askYesNo(
			"更新 MapCatalog 版本号（当前 ${currentMapCatalogVersion}）?",
			false
		)
		String mapCatalogVersion = updateMapCatalogVersion
			? askVersion('MapCatalog', currentMapCatalogVersion)
			: currentMapCatalogVersion

		String tagName = "v${carpetVersion}${includeMapCatalog ? '-mapcatalog' : ''}"
		if (runGit(['rev-parse', '--verify', "refs/tags/${tagName}"], true).exitCode == 0) {
			throw new GradleException("标签 ${tagName} 已存在，请使用新的版本号。")
		}
		if (!runGit(['diff', '--check']).stdout.isEmpty()) {
			throw new GradleException('当前工作区存在空白字符错误，已取消发布。')
		}
		if (!updateCarpetVersion && !updateMapCatalogVersion) {
			throw new GradleException('至少需要更新一个版本号，不能创建没有版本变更的发布提交。')
		}

		String updatedProperties = replaceProperty(originalProperties, 'mod_version', carpetVersion)
		updatedProperties = replaceProperty(updatedProperties, 'mapcatalog_version', mapCatalogVersion)
		String updatedChangelog = insertChangelogEntry(
			originalChangelog,
			carpetVersion,
			tagName,
			java.time.LocalDate.now().toString()
		)
		String updatedReadme = includeMapCatalog
			? updateMapCatalogReadme(originalReadme, tagName)
			: originalReadme
		propertiesFile.setText(updatedProperties, StandardCharsets.UTF_8.name())
		changelogFile.setText(updatedChangelog, StandardCharsets.UTF_8.name())
		if (includeMapCatalog) {
			readmeFile.setText(updatedReadme, StandardCharsets.UTF_8.name())
		}
		boolean releaseCommitCreated = false
		List<String> releaseFiles = ['gradle.properties', 'CHANGELOG.md']
		if (includeMapCatalog) {
			releaseFiles.add('README.md')
		}

		try {
			println('')
			println('已生成 CHANGELOG.md 发布模板，请在记事本中补全本次变更内容。')
			while (true) {
				openNotepad(changelogFile)
				String editedChangelog = changelogFile.getText(StandardCharsets.UTF_8.name())
				String normalizedChangelog = normalizeChangelogEnding(editedChangelog)
				if (normalizedChangelog != editedChangelog) {
					changelogFile.setText(normalizedChangelog, StandardCharsets.UTF_8.name())
					editedChangelog = normalizedChangelog
				}
				if (changelogEntryHasContent(editedChangelog, carpetVersion)) {
					break
				}
				println('CHANGELOG.md 至少需要填写一条以 "- " 开头的变更内容。')
				if (!askYesNo('是否重新打开记事本继续编辑?', true)) {
					restoreReleaseFiles()
					println('发布操作已取消，版本文件和 CHANGELOG.md 已恢复。')
					return
				}
			}

			println('')
			println("即将创建标签: ${tagName}")
			println("Carpet JFT Addition: ${currentCarpetVersion} -> ${carpetVersion}")
			if (includeMapCatalog) {
				println("MapCatalog: ${currentMapCatalogVersion} -> ${mapCatalogVersion}")
				println("README.md: 更新 MapCatalog 下载链接 -> https://github.com/R-Matrix/Carpet-JFT-Addition/releases/tag/${tagName}")
			}
			println('即将提交的变更:')
			runGit(['diff', '--check'])
			runGit(['add', '--'] + releaseFiles)
			println(runGit(['diff', '--cached', '--'] + releaseFiles).stdout)

			if (!askYesNo('确认创建 release commit 和 tag?', false)) {
				runGit(['restore', '--staged', '--'] + releaseFiles, true)
				restoreReleaseFiles()
				println('发布操作已取消，版本文件、CHANGELOG.md 和 README.md 已恢复。')
				return
			}

			String commitMessage = includeMapCatalog
				? "chore(release): release Carpet ${carpetVersion} with MapCatalog ${mapCatalogVersion}"
				: "chore(release): release Carpet ${carpetVersion}"
			runGit(['commit', '-m', commitMessage])
			releaseCommitCreated = true
			runGit(['tag', '-a', tagName, '-m', "Release ${tagName}"])

			println('')
			println("已创建 release commit 和标签 ${tagName}。尚未推送到远端。")
			println("推送命令: git push origin ${branch} --follow-tags")
		} catch (Exception exception) {
			if (!releaseCommitCreated) {
				runGit(['restore', '--staged', '--'] + releaseFiles, true)
				restoreReleaseFiles()
			}
			println("发布操作在创建提交或标签时失败: ${exception.message}")
			throw exception
		}
	}
}
