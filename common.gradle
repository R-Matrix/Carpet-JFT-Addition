final int mcVersion = project.mcVersion

apply plugin: 'maven-publish'
apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'me.fallenbreath.yamlang'

version = project.mod_version + '-mc' + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
	maven {
		url 'https://repository.hanbings.io/proxy'
	}
	maven {
		//the maven that carpet resides in
		name = "masa's maven"
		url = "https://masa.dy.fi/maven"
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties files in versions/<mc_version>/
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Carpet mod!
	modImplementation "carpet:fabric-carpet:${project.carpet_core_version}"

	// Conditional Mixin: 按 MC 版本在运行时决定部分 mixin 是否应用
	include(modImplementation("me.fallenbreath:conditional-mixin-fabric:0.6.4") {
		exclude group: "net.fabricmc.fabric-api"
		transitive = false
	})

	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'commons-io:commons-io:2.15.1'
	implementation 'com.google.guava:guava:32.1.3-jre'
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "minecraft_dependency", project.minecraft_dependency

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version, "minecraft_dependency": inputs.properties.minecraft_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
	}
}

yamlang {
	targetSourceSets = [sourceSets.main]
	inputDir = 'assets/carpetjftaddition/lang'
	// Should the original yaml language files be preserved after the conversion
	// Default value: false, which means those yaml language files will be deleted after the conversion
	preserveYaml = true

	// The file encoding of the language files
	// Given that Minecraft uses UTF-8 to load language files, it's generally advised to just keep the default value
	// Default value: "UTF-8"
	charset = 'UTF-8'
}
