final int mcVersion = project.mcVersion

def buildMapCatalog = providers.gradleProperty('buildMapCatalog')
		.map { Boolean.parseBoolean(it) }
		.orElse(true)
def embedMapCatalog = providers.gradleProperty('embedMapCatalog')
		.map { Boolean.parseBoolean(it) }
		.orElse(buildMapCatalog)

apply plugin: 'maven-publish'
apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'me.fallenbreath.yamlang'

// 构建版本后缀: 发布构建不带后缀, CI 开发构建 +build.<序号>, 本地构建 -SNAPSHOT (与 Igny 一致)
String modVersionSuffix = ''
if (System.getenv("BUILD_RELEASE") != "true") {
	String buildNumber = System.getenv("BUILD_ID")
	modVersionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT'
}
String fullModVersion = project.mod_version + modVersionSuffix

version = project.mod_version + '-mc' + project.minecraft_version + modVersionSuffix
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// 游戏测试源码集: 只用于 runGameTest, 不进发布 jar
sourceSets {
	testmod {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

loom {
	// mixin 审计运行配置: 启动服务器检查所有 mixin 注入是否真实生效
	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=false']
	runs {
		serverMixinAudit {
			server()
			// 默认 when=mod_init: 模组加载阶段即审计退出, 不等服务器 initServer 完成
			vmArgs(*commonVmArgs, '-DmixinAuditor.audit=true')
		}
		gameTest {
			server()
			source sourceSets.testmod
			vmArg '-Dfabric-api.gametest'
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
	maven {
		url 'https://repository.hanbings.io/proxy'
	}
	maven {
		//the maven that carpet resides in
		name = "masa's maven"
		url = "https://masa.dy.fi/maven"
	}
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties files in versions/<mc_version>/
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Carpet mod!
	modImplementation "carpet:fabric-carpet:${project.carpet_core_version}"

	// Conditional Mixin: 按 MC 版本在运行时决定部分 mixin 是否应用
	include(modImplementation("me.fallenbreath:conditional-mixin-fabric:0.6.4") {
		exclude group: "net.fabricmc.fabric-api"
		transitive = false
	})

	// Mixin 审计: 仅运行时使用 (CI 的 runServerMixinAudit), 不进发布 jar
	modRuntimeOnly("me.fallenbreath:mixin-auditor:0.2.0-o") {
		exclude group: "net.fabricmc.fabric-api"
	}

	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'commons-io:commons-io:2.15.1'
	implementation 'com.google.guava:guava:32.1.3-jre'
}

processResources {
	inputs.property "version", fullModVersion
	inputs.property "minecraft_dependency", project.minecraft_dependency

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version, "minecraft_dependency": inputs.properties.minecraft_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// The server-only MapCatalog remains an independent Fabric mod, but the
// Carpet artifact may carry the matching version as a nested JAR. When the
// MapCatalog subproject is excluded (for example in the Carpet CI job), the
// prebuilt JAR is read from mapCatalogArtifactsDir instead.
if (!project.name.startsWith('mapcatalog-') && embedMapCatalog.get()) {
	def mapCatalogProject = rootProject.findProject(":mapcatalog-${project.name}")
	if (mapCatalogProject != null) {
		evaluationDependsOn(mapCatalogProject.path)
		def mapCatalogRemapJar = mapCatalogProject.tasks.named('remapJar')
		tasks.named('remapJar') {
			dependsOn(mapCatalogRemapJar)
			nestedJars.from(mapCatalogRemapJar.flatMap { it.archiveFile })
			addNestedDependencies = true
		}
	} else {
		File artifactsDirectory = providers.gradleProperty('mapCatalogArtifactsDir')
				.map { rootProject.file(it) }
				.orElse(rootProject.file('build/mapcatalog-embedding'))
				.get()
		File mapCatalogJar = new File(artifactsDirectory, "${project.minecraft_version}/mapcatalog-server.jar")
		tasks.named('remapJar') {
			nestedJars.from(mapCatalogJar)
			addNestedDependencies = true
			inputs.file(mapCatalogJar)
			doFirst {
				if (!mapCatalogJar.isFile()) {
					throw new GradleException(
							"MapCatalog embedding was requested for ${project.name}, but no prebuilt JAR was found at ${mapCatalogJar}. "
									+ "Build MapCatalog first or disable -PembedMapCatalog."
					)
				}
			}
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
	}
}

yamlang {
	targetSourceSets = [sourceSets.main]
	inputDir = 'assets/carpetjftaddition/lang'
	// Should the original yaml language files be preserved after the conversion
	// Default value: false, which means those yaml language files will be deleted after the conversion
	preserveYaml = true

	// The file encoding of the language files
	// Given that Minecraft uses UTF-8 to load language files, it's generally advised to just keep the default value
	// Default value: "UTF-8"
	charset = 'UTF-8'
}
